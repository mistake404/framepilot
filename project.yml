name: FramePilot
options:
  bundleIdPrefix: com.framepilot
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: "NO"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  FramePilot:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - "Info.plist"
    settings:
      base:
        INFOPLIST_FILE: Sources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.framepilot.app
        PRODUCT_NAME: FramePilot
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        GENERATE_INFOPLIST_FILE: "NO"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
    frameworks:
      - sdk: ARKit.framework
      - sdk: AVFoundation.framework
      - sdk: CoreMotion.framework
      - sdk: CoreImage.framework
      - sdk: Photos.framework
      - sdk: SceneKit.framework
      - sdk: SwiftUI.framework
      - sdk: UIKit.framework
